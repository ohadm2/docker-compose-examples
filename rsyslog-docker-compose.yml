services:
  rsyslog:
    build:
      context: .
      dockerfile: rsyslogd.dockerfile
    hostname: rsyslog
    ports:
      - "5514:5514/tcp"
      - "5514:5514/udp"
    volumes:
      - ./rsyslog.conf:/etc/rsyslog.conf

  php:
    build:
      context: .
      dockerfile: php.dockerfile
      args:
        php_tag: $PHP_TAG
        nodejs_tag: $NODEJS_TAG
        npm_tag: $NPM_TAG
        angular_tag: $ANGULAR_TAG
    container_name: "${PROJECT_NAME}_php"
    restart: "always"
    environment:
      PHP_FPM_USER: wodby
      PHP_FPM_GROUP: wodby
      COLUMNS: 80
      PHP_XDEBUG: 1
      # Extensions xdebug, xhprof and spx disabled by default
      PHP_EXTENSIONS_DISABLE: xhprof,spx
      PHP_XDEBUG_MODE: debug,develop
      # PHP_XDEBUG_MODE: profile
      PHP_XDEBUG_START_WITH_REQUEST: "yes"
      PHP_XDEBUG_IDEKEY: "VSCODE"
      PHP_XDEBUG_CLIENT_PORT: 9003
      PHP_XDEBUG_LOG: /tmp/php-xdebug.log
      PHP_MEMORY_LIMIT: 4G
      # PHP_OPCACHE_ENABLE: "off"
    volumes:
      - ./..:/var/www/html:cached
    #  - /docker-data/docker_rsyslog_s9:/var/log/rsyslog-survey8.log
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx
    hostname: nginx
    #logging:
    #  driver: syslog
    #  options:
    #    syslog-address: "tcp://127.0.0.1:514"
    depends_on:
      - rsyslog
    volumes:
       - ./nginx.conf:/etc/nginx/nginx.conf
