
services:
  phpipam-web:
    image: phpipam/phpipam-www:latest
    ports:
      - "8888:80"
    environment:
      - TZ=Asia/Jerusalem
      - IPAM_DATABASE_HOST=phpipam-mariadb
      - IPAM_DATABASE_PASS=password
      - IPAM_DATABASE_WEBHOST=%
    restart: unless-stopped
    volumes:
      - phpipam-logo:/phpipam/css/images/logo
      - phpipam-ca:/usr/local/share/ca-certificates:ro
      - ./config.dist.php:/phpipam/config.dist.php
    depends_on:
      - phpipam-mariadb

  phpipam-cron:
    image: phpipam/phpipam-cron:latest
    environment:
      - TZ=Asia/Jerusalem
      - IPAM_DATABASE_HOST=phpipam-mariadb
      - IPAM_DATABASE_PASS=password
      - SCAN_INTERVAL=1h
    restart: unless-stopped
    volumes:
      - phpipam-ca:/usr/local/share/ca-certificates:ro
    depends_on:
      - phpipam-mariadb

  phpipam-mariadb:
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=password
    restart: unless-stopped
    volumes:
      - phpipam-db-data:/var/lib/mysql

  nginx:
    build:
      context: .
      dockerfile: nginx.dockerfile
    hostname: php-nginx
    #logging:
    #  driver: syslog
    #  options:
    #    syslog-address: "tcp://127.0.0.1:514"
    volumes:
       - ./nginx.conf:/etc/nginx/conf.d/server.conf
       - ./phpipam:/var/www/html
    environment:
      - TZ=Asia/Jerusalem
      - IPAM_DATABASE_HOST=phpipam-mariadb
      - IPAM_DATABASE_PASS=password
      - IPAM_DATABASE_WEBHOST=%       
    ports:
       - "8989:8080"   

volumes:
  phpipam-db-data:
  phpipam-logo:
  phpipam-ca:
  

